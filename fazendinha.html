<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Nossa Fazendinha — 26 anos de você, 5 anos de nós</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:#0a0f0a;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;overflow:hidden;font-family:'Press Start 2P',monospace;
    touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  }
  #stage{position:relative;padding:10px;background:#141a14;border:1px solid #2a332a;border-radius:10px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
  canvas{display:block;background:#000;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
  #bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
  #hint{font-size:8px;color:#6b7a6b;text-align:center;line-height:1.8;max-width:430px}
  button.ui{font-family:inherit;font-size:8px;color:#9ab89a;background:#1a221a;border:1px solid #2f3a2f;border-radius:6px;padding:7px 10px;cursor:pointer}
  button.ui:active{background:#243024}
</style>
</head>
<body>

<div id="stage"><canvas id="game" width="256" height="240"></canvas></div>
<div id="bar">
  <div id="hint">TOQUE: NÓS DOIS, GALINHAS, VACA, COFRINHO, FLORES, CENOURAS, NUVEM...</div>
  <button class="ui" id="bSnd" type="button">SOM: ON</button>
  <button class="ui" id="bFs" type="button">TELA CHEIA</button>
</div>

<script>
'use strict';
/* ============================================================
   NOSSA FAZENDINHA — 26 flores (uma por ano dela) + cofrinho
   que nunca zera: cada dia juntos, o porquinho cresce mais.
   ============================================================ */

const cvs=document.getElementById('game'), ctx=cvs.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=256,H=240;
const CYCLE_SEC=100;      // duração do dia (segundos) — mude aqui se quiser

/* ---------------- TEXTOS (edite aqui) ---------------- */
const MSGS=[
  {at:0.10, text:'Em 26 anos de vida, você se tornou a pessoa mais maravilhosa que eu conheci.'},
  {at:0.30, text:'São 5 anos dividindo a vida comigo. Eu escolheria cada um deles de novo.'},
  {at:0.48, text:'Nessa fazendinha que é a nossa vida, cuidar de você é meu trabalho favorito.'},
  {at:0.62, text:'Vou continuar criando coisas pra você e comemorando cada conquista ao seu lado.'},
  {at:0.76, text:'Cada moedinha no cofrinho é um dia seu que eu guardo com todo o cuidado.'},
  {at:0.86, text:'Você é a pessoa que eu quero na minha vida. Hoje, amanhã e sempre.'}
];
const PIG_MSGS=[
  'Nosso cofrinho só cresce. Como a gente.',
  'Guardo cada momento com você como tesouro.',
  'Um dia construímos a casinha dos sonhos. Enquanto isso, essa já é linda.'
];
const FINAL={l1:'26 ANOS DE VOCÊ. 5 ANOS DE NÓS.', l2:'VOCÊ É A PESSOA QUE EU QUERO PRA SEMPRE.', big:'TE AMO', l4:'FELIZ 26 ANOS, MEU AMOR.'};

/* ---------------- SPRITES ---------------- */
const HP ={k:'#181818',s:'#8a5a3b',g:'#2e8b57',j:'#28418c',w:'#f0f0e8',t:'#1f5c46'};
const HP2={k:'#241812',s:'#b07a52',h:'#5a3a22',p:'#e2557f',w:'#f0f0e8'};
const HEAD=[
'...kkkkkkkk...','..kkkkkkkkkk..','..kksssssskk..','..kssssssssk..',
'..kssksskssk..','..kssssssssk..','..ksskkkkssk..','..kkkkkkkkkk..',
'...kkkkkkkk...','...kssssssk...'];
const TORSO=[
'.kggggggggggk.','.kggggggggggk.','.ksggggggggsk.','.kstggggggtsk.',
'.kstggggggtsk.','.kssggggggssk.','..kkggggggkk..'];
const LEGS_I=['...jjjjjjjj...','...jjjjjjjj...','...jjj..jjj...','...jjj..jjj...','...jjj..jjj...','..kkkk..kkkk..','..wwww..wwww..'];
const LEGS_A=['...jjjjjjjj...','...jjjjjjjj...','..jjj....jjj..','.jjj......jjj.','.jjj......jjj.','kkkk......kkkk','wwww......wwww'];
const LEGS_B=['...jjjjjjjj...','...jjjjjjjj...','....jjjjjj....','.....jjjjj....','.....jjjj.....','....kkkkk.....','....wwwww.....'];
const ARMS_HAM1=['tttt..........','.ttt..........','.tt.gggggggk..','.tt.gggggggk..','..t.gggggggk..','....gggggggk..'];
const ARMS_HAM2=['..............','......ggggggk.','.ttt.gggggggk.','.ttt.gggggggk.','..tt.gggggggk.','....gggggggk..'];
const LEGS_SIT=['.jjjjjjjjjj..','.jj.jjjj.jj..','.kk.kjjk.kk..','.ww.wwww.ww..'];

const HER_BODY=[
'...kk.kk.kk...','..kkkkkkkkkk..','.kkhkkhkkhkkk.','.kkkkkkkkkkkk.',
'.kksssssssskk.','..kssksskssk..','..kssssssssk..','...kssssssk...',
'....kssssk....','.kkk.ssss.kkk.','.kkk.pppp.kkk.','..kk.pppp.kk..',
'....pppppp....','...pppppppp...','..pppppppppp..','.pppppppppppp.',
'.pppppppppppp.','...ss....ss...','..www....www..'];
const HER_SIT=[
'...kk.kk.kk...','..kkkkkkkkkk..','.kkhkkhkkhkkk.','.kkkkkkkkkkkk.',
'.kksssssssskk.','..kssksskssk..','..kssssssssk..','...kssssssk...',
'.kkk..kssk.kk.','.kkkkpppppkkk.','..kkppppppkk..','....pppppp....',
'.ss.pppppp.ss.','.ww..pppp..ww.'];

function sprite(rows,pal){
  const c=document.createElement('canvas');c.width=rows[0].length;c.height=rows.length;
  const g=c.getContext('2d');
  rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const ch=r[x];if(ch!=='.'){g.fillStyle=pal[ch];g.fillRect(x,y,1,1);}}});
  return c;
}
function flip(img){
  const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
  const g=c.getContext('2d');g.translate(img.width,0);g.scale(-1,1);g.drawImage(img,0,0);return c;
}
const HIM={
  idle:sprite(HEAD.concat(TORSO,LEGS_I),HP),
  wa:  sprite(HEAD.concat(TORSO,LEGS_A),HP),
  wb:  sprite(HEAD.concat(TORSO,LEGS_B),HP),
  h1:  sprite(HEAD.concat(ARMS_HAM1,TORSO.slice(1),LEGS_I),HP),
  h2:  sprite(HEAD.concat(ARMS_HAM2,TORSO.slice(1),LEGS_I),HP),
  sit: sprite(HEAD.concat(TORSO.slice(0,6),LEGS_SIT),HP)
};
const HIML={idle:flip(HIM.idle),wa:flip(HIM.wa),wb:flip(HIM.wb),h1:flip(HIM.h1),h2:flip(HIM.h2),sit:flip(HIM.sit)};
const HER ={idle:sprite(HER_BODY,HP2), sit:sprite(HER_SIT,HP2)};
const HERL={idle:flip(HER.idle), sit:flip(HER.sit)};
const HEART=sprite(['.kk..kk.','khrrkrrk','krrrrrrk','.krrrrk.','..krrk..','...kk...'],{k:'#181818',r:'#e23b4e',h:'#ff97a0'});

/* ---------------- ÁUDIO ---------------- */
let ac=null,masterG=null,noiseBuf=null,muted=false;
function initAudio(){
  if(muted)return;
  if(ac){if(ac.state==='suspended')ac.resume();return;}
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    masterG=ac.createGain();masterG.gain.value=0.5;masterG.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,ac.sampleRate*0.3,ac.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){ac=null;}
}
const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function nf(n){const m=n.match(/^([A-G])(\d)$/);return 440*Math.pow(2,(NOTE[m[1]]+(+m[2]+1)*12-69)/12);}
function tone(f,t,d,type,v,slideTo){
  if(!ac)return;type=type||'square';v=v||0.05;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slideTo)o.frequency.linearRampToValueAtTime(slideTo,t+d);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(v,t+0.006);
  g.gain.setValueAtTime(v,Math.max(t+0.006,t+d-0.03));
  g.gain.linearRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(masterG);o.start(t);o.stop(t+d+0.03);
}
function noiseHit(t,d,v,rate){
  if(!ac)return;
  const s=ac.createBufferSource();s.buffer=noiseBuf;s.playbackRate.value=rate||1;
  const g=ac.createGain();g.gain.setValueAtTime(v||0.03,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(g);g.connect(masterG);s.start(t);s.stop(t+d+0.02);
}
const now=()=>ac?ac.currentTime:0;
const sfx={
  heart(){tone(nf('B5'),now(),0.06,'square',0.05);tone(nf('E6'),now()+0.06,0.2,'square',0.05);},
  blip(){tone(560+Math.random()*240,now(),0.03,'square',0.018);},
  coin(){tone(nf('E6'),now(),0.05,'square',0.04);tone(nf('B6'),now()+0.05,0.1,'square',0.035);},
  cluck(){tone(900,now(),0.05,'square',0.04,1400);tone(700,now()+0.07,0.06,'square',0.035,1100);},
  moo(){tone(200,now(),0.15,'triangle',0.09,150);tone(170,now()+0.16,0.35,'triangle',0.09,110);},
  pop(){tone(660,now(),0.05,'square',0.045,990);},
  toc(){noiseHit(now(),0.06,0.05,0.7);tone(190,now(),0.06,'triangle',0.05,120);},
  water(){noiseHit(now(),0.12,0.02,2.4);},
  chime(){[660,880,990].forEach((f,i)=>tone(f,now()+i*0.07,0.12,'square',0.035));},
  bloom(){tone(nf('E5'),now(),0.08,'triangle',0.04);tone(nf('B5'),now()+0.08,0.14,'triangle',0.04);},
  boom(){noiseHit(now(),0.5,0.07,0.45);tone(300,now(),0.4,'triangle',0.035,70);},
  rain(){noiseHit(now(),0.08,0.012,3.2);}
};
const SONG={bpm:96,len:32,
  mel:['E5','.','.','G5','.','.','C6','.','B5','.','G5','.','A5','.','.','.',
       'F5','.','.','A5','.','.','D6','.','C6','.','G5','.','E5','.','.','.'],
  bass:['C3','.','.','.','G2','.','.','.','A2','.','.','.','F2','.','.','.',
        'F2','.','.','.','C3','.','.','.','G2','.','.','.','C3','.','.','.']};
let mStep=0,mNext=0;
setInterval(()=>{
  if(!ac||muted)return;
  const n=ac.currentTime;
  if(mNext<n-0.3)mNext=n+0.05;
  const spb=60/SONG.bpm/2;
  while(mNext<n+0.2){
    const i=mStep%SONG.len,m=SONG.mel[i],b=SONG.bass[i];
    if(m&&m!=='.')tone(nf(m),mNext,spb*1.8,'square',0.028);
    if(b&&b!=='.')tone(nf(b),mNext,spb*1.9,'triangle',0.07);
    mNext+=spb;mStep++;
  }
},50);

/* ---------------- MUNDO ---------------- */
const GY=190;
const PIGX=84, PIGY=206;               // o cofrinho (porquinho)
const skyStops=[[0,'#9adbe8'],[0.30,'#7cc6e0'],[0.50,'#f5b96e'],[0.62,'#e07a8a'],[0.72,'#2a2f55'],[0.85,'#10142c'],[1.001,'#10142c']];
function hex2rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mixC(a,b,f){const A=hex2rgb(a),B=hex2rgb(b);return 'rgb('+Math.round(A[0]+(B[0]-A[0])*f)+','+Math.round(A[1]+(B[1]-A[1])*f)+','+Math.round(A[2]+(B[2]-A[2])*f)+')';}
function skyColor(t){
  for(let i=0;i<skyStops.length-1;i++){
    if(t>=skyStops[i][0]&&t<skyStops[i+1][0]){
      const f=(t-skyStops[i][0])/(skyStops[i+1][0]-skyStops[i][0]);
      return mixC(skyStops[i][1],skyStops[i+1][1],f);
    }
  }
  return skyStops[skyStops.length-1][1];
}
function darkness(t){ return t<0.5?0 : t<0.75?(t-0.5)/0.25*0.45 : 0.45; }

const FLOWERS=[];
for(let i=0;i<26;i++){
  FLOWERS.push({x:14+i*9+((i%3)-1),y:GY+8+((i*7)%6),bloom:false,c:['#e2557f','#ffd23e','#4aa3df','#ff9d3e'][i%4],ph:i});
}
const STARS=[];
for(let i=0;i<26;i++)STARS.push({x:(i*53+17)%250+3,y:(i*37)%90+8,tw:i});
const CROPS=[
  {x:158,y:206,k:'c'},{x:176,y:206,k:'c'},{x:194,y:206,k:'c'},
  {x:166,y:222,k:'p'},{x:196,y:224,k:'p'},
  {x:214,y:206,k:'w'},{x:230,y:206,k:'w'},{x:222,y:222,k:'w'}
];
CROPS.forEach(c=>{c.show=true;c.timer=0;});
const CHICKENS=[{x:100,y:GY+8,d:1,st:'walk',tm:60},{x:130,y:GY+16,d:-1,st:'walk',tm:30},{x:148,y:GY+4,d:1,st:'peck',tm:40}];
const cow={x:170,y:GY-6,tail:0,eat:0};
const her={x:175,y:GY-19,dir:-1,pose:'water',arrived:false,met:false};
const him={x:95,y:GY-24,dir:1,pose:'hammer',arrived:false,met:false};
let parts=[],rain=0,heartFly=[],fireflies=[],birds=[],smoke=[],fw=[];
let coinsFly=[],coinCount=0,pigJig=0,pigMsgI=0;
let carinho=0,frame=0,cycleT=0,state='title',msgIdx=0,dlg=null,finalOn=false;
const butterflies=[{x:60,y:150,ph:0},{x:120,y:145,ph:2}];
const clouds=[{x:30,y:38,w:44,s:0.08},{x:140,y:60,w:52,s:0.06},{x:200,y:26,w:38,s:0.1}];

function spawnHeart(x,y){heartFly.push({x:x,y:y,vy:-0.5,life:50,ph:Math.random()*6});}
function sparkle(x,y,col,n){for(let i=0;i<n;i++)parts.push({x:x,y:y,vx:(Math.random()-0.5)*1.4,vy:(Math.random()-1)*1.4,life:24,col:col});}
function earnCoins(n,sx,sy){coinsFly.push({sx:sx,sy:sy,t:0,n:n});}
function say(text){dlg={text:text,chars:0,hold:0};sfx.chime();}

/* ---------------- INPUT ---------------- */
let TOUCH=false;
if(matchMedia('(pointer:coarse)').matches||'ontouchstart' in window){TOUCH=true;}
function canvasXY(e){
  const r=cvs.getBoundingClientRect();
  return {x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height};
}
function hit(mx,my,x,y,r){return Math.abs(mx-x)<r&&Math.abs(my-y)<r;}
function tap(mx,my){
  initAudio();
  if(state==='title'){state='life';sfx.pop();return;}
  if(finalOn){ restart(); return; }
  if(dlg){ if(dlg.chars<dlg.text.length){dlg.chars=dlg.text.length;} else dlg=null; return; }
  if(hit(mx,my,her.x+7,her.y+9,12)){spawnHeart(her.x+7,her.y-4);carinho++;earnCoins(1,her.x+7,her.y);sfx.heart();return;}
  if(hit(mx,my,him.x+7,him.y+12,13)){spawnHeart(him.x+7,him.y-4);carinho++;earnCoins(1,him.x+7,him.y);sfx.heart();return;}
  for(const c of CHICKENS){
    if(hit(mx,my,c.x+4,c.y-4,9)){c.st='jump';c.tm=18;sfx.cluck();carinho++;earnCoins(2,c.x+4,c.y-12);spawnHeart(c.x+4,c.y-12);return;}
  }
  if(hit(mx,my,cow.x+11,cow.y-8,16)){sfx.moo();carinho++;earnCoins(2,cow.x+11,cow.y-18);spawnHeart(cow.x+11,cow.y-18);return;}
  if(hit(mx,my,PIGX+2,PIGY-3,14)){
    pigJig=12;sfx.pop();
    say(PIG_MSGS[pigMsgI%PIG_MSGS.length]);pigMsgI++;
    return;
  }
  for(const c of CROPS){
    if(c.show&&hit(mx,my,c.x,c.y,8)){
      c.show=false;c.timer=300;sfx.pop();carinho++;
      earnCoins(5,c.x,c.y-6);sparkle(c.x,c.y-4,'#ffd23e',6);spawnHeart(c.x,c.y-10);return;
    }
  }
  for(const f of FLOWERS){
    if(hit(mx,my,f.x,f.y,6)){sfx.bloom();carinho++;f.bloom=true;earnCoins(1,f.x,f.y-6);sparkle(f.x,f.y-4,f.c,5);return;}
  }
  if(hit(mx,my,clouds[1].x+26,clouds[1].y+5,30)){rain=200;sfx.rain();carinho++;earnCoins(3,mx,my);return;}
  sfx.pop();
}
cvs.addEventListener('pointerdown',e=>{e.preventDefault();const p=canvasXY(e);tap(p.x,p.y);});

const bSnd=document.getElementById('bSnd');
bSnd.addEventListener('click',()=>{muted=!muted;bSnd.textContent='SOM: '+(muted?'OFF':'ON');if(!muted)initAudio();});
const bFs=document.getElementById('bFs');
if(document.documentElement.requestFullscreen){
  bFs.addEventListener('click',()=>{
    if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(function(){});
    else document.exitFullscreen();
  });
}else{bFs.style.display='none';}
function restart(){
  cycleT=0;msgIdx=0;dlg=null;finalOn=false;fw=[];
  FLOWERS.forEach(f=>f.bloom=false);
  her.x=175;her.dir=-1;her.pose='water';her.arrived=false;her.met=false;
  him.x=95;him.dir=1;him.pose='hammer';him.arrived=false;him.met=false;
  /* coinCount e carinho NÃO zeram: cada dia soma no cofrinho de vocês */
}

/* ---------------- UPDATE ---------------- */
function update(){
  if(pigJig>0)pigJig--;
  if(state==='life'){
    cycleT+=1/(60*CYCLE_SEC);
    if(cycleT>=1)cycleT=1;
    FLOWERS.forEach((f,i)=>{ if(!f.bloom && cycleT>(i+1)/27*0.8){f.bloom=true;if(i%6===0)sfx.bloom();} });
    if(msgIdx<MSGS.length && cycleT>MSGS[msgIdx].at){ say(MSGS[msgIdx].text); msgIdx++; }
    if(cycleT>0.93&&!finalOn){ finalOn=true; sfx.boom(); for(let i=0;i<3;i++)launchFw(); }
    if(cycleT<0.30){
      her.pose='water'; him.pose='hammer';
      if(frame%26===0){
        parts.push({x:her.x-8,y:her.y+8,vx:-0.5-Math.random()*0.4,vy:0.3,life:16,col:'#8fd3ff'});
        if(frame%52===0)sfx.water();
        if(frame%104===0)earnCoins(1,her.x-10,her.y);   // regar rende moedinhas
      }
      if(frame%44===0){
        parts.push({x:him.x+2,y:him.y-2,vx:(Math.random()-0.5)*0.8,vy:-0.6,life:10,col:'#c8b070'});
        sfx.toc();
        if(frame%132===0)earnCoins(1,him.x+8,him.y-2);  // martelar também
      }
    } else if(cycleT<0.42){
      her.pose='walk'; him.pose='walk';
      if(her.x>122){her.x-=0.45;her.dir=-1;}else if(!her.arrived){her.arrived=true;}
      if(him.x<134){him.x+=0.45;him.dir=1;}else if(!him.arrived){him.arrived=true;}
      if(her.arrived&&him.arrived&&!her.met){
        her.met=true;him.met=true;her.pose='idle';him.pose='idle';her.dir=-1;him.dir=1;
        spawnHeart(128,GY-40);earnCoins(10,128,GY-30);sfx.heart();carinho++;
      }
    } else {
      her.pose='sit'; him.pose='sit';
      if(frame%180===0){ spawnHeart(122+Math.random()*12,GY-38); }
      if(frame%360===0){ earnCoins(2,128,GY-34); }      // o fim de tarde também poupa
    }
    if(frame%46===0)smoke.push({x:70,y:92,vy:-0.25,life:110,r:2});
    if(cycleT<0.55&&frame%540===0)birds.push({x:-8,y:40+Math.random()*40,v:0.7+Math.random()*0.4});
  }
  if(state==='title'){
    cycleT=0.12;
    if(frame%30===0){parts.push({x:her.x-8,y:her.y+8,vx:-0.5,vy:0.3,life:16,col:'#8fd3ff'});}
  }
  if(rain>0){
    rain--;
    if(frame%2===0){parts.push({x:150+Math.random()*100,y:70,vx:0,vy:2.2,life:60,col:'#9fd0f0'});}
    if(frame%40===0)sfx.rain();
    CROPS.forEach(c=>{if(!c.show&&c.timer>0)c.timer-=2;});
  }
  if(cycleT>0.66&&fireflies.length<14&&frame%20===0){
    fireflies.push({x:20+Math.random()*216,y:120+Math.random()*60,ph:Math.random()*6,vx:0,vy:0});
  }
  fireflies.forEach(f=>{
    f.vx+=(Math.random()-0.5)*0.04;f.vy+=(Math.random()-0.5)*0.04;
    f.vx*=0.96;f.vy*=0.96;f.x+=f.vx;f.y+=f.vy;
    f.x=Math.max(8,Math.min(248,f.x));f.y=Math.max(100,Math.min(180,f.y));
  });
  if(cycleT<0.6)fireflies.length=0;
  if(finalOn&&frame%110===0)launchFw();
  fw.forEach(f=>{f.y-=1.2;f.life--;if(f.life<=0&&!f.boom){f.boom=true;sfx.boom();
    for(let i=0;i<26;i++){const a=Math.PI*2*i/26,sp=0.7+Math.random()*1.1;
      parts.push({x:f.x,y:f.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:30,col:['#e23b4e','#ffd23e','#4aa3df','#e2557f','#7bd66f'][i%5]});}}});
  fw=fw.filter(f=>f.life>0);
  CHICKENS.forEach(c=>{
    c.tm--;
    if(c.st==='jump'){ if(c.tm<=0){c.st='peck';c.tm=30;} }
    else if(c.st==='walk'){
      c.x+=0.18*c.d;
      if(c.x<88||c.x>160){c.d*=-1;c.st='peck';c.tm=40;}
      if(c.tm<=0){c.st='peck';c.tm=30+Math.random()*50;}
    } else { if(c.tm<=0){c.st='walk';c.tm=80+Math.random()*100;} }
  });
  cow.tail++;cow.eat++;
  smoke.forEach(s=>{s.y+=s.vy;s.x+=0.08;s.r+=0.05;s.life--;});
  smoke=smoke.filter(s=>s.life>0);
  birds.forEach(b=>{b.x+=b.v;});
  birds=birds.filter(b=>b.x<W+10);
  clouds.forEach(c=>{c.x+=c.s;if(c.x>W+20)c.x=-c.w-10;});
  butterflies.forEach(b=>{b.ph+=0.03;b.x+=Math.cos(b.ph)*0.3;b.y+=Math.sin(b.ph*1.7)*0.4;});
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.02;p.life--;});
  parts=parts.filter(p=>p.life>0);
  heartFly.forEach(h=>{h.y+=h.vy;h.x+=Math.sin(h.ph+=0.1)*0.3;h.life--;});
  heartFly=heartFly.filter(h=>h.life>0);
  CROPS.forEach(c=>{if(!c.show){c.timer--;if(c.timer<=0){c.show=true;sfx.bloom();}}});
  /* moedas voando até o porquinho */
  coinsFly.forEach(c=>{c.t+=0.045;});
  coinsFly=coinsFly.filter(c=>{
    if(c.t>=1){coinCount+=c.n;pigJig=10;sfx.coin();return false;}
    return true;
  });
  if(dlg){
    if(dlg.chars<dlg.text.length){dlg.chars+=0.55;if(frame%3===0)sfx.blip();}
    else{dlg.hold++;if(dlg.hold>210)dlg=null;}
  }
}
function launchFw(){fw.push({x:30+Math.random()*196,y:60+Math.random()*40,life:50+Math.random()*30,boom:false});}

/* ---------------- DRAW ---------------- */
function txt(s,x,y,c,size,align){
  ctx.font=(size||8)+'px "Press Start 2P"';ctx.textAlign=align||'left';ctx.textBaseline='top';
  ctx.fillStyle='#101014';ctx.fillText(s,Math.round(x)+1,Math.round(y)+1);
  ctx.fillStyle=c||'#fff';ctx.fillText(s,Math.round(x),Math.round(y));
}
function wrap(s,max){
  const out=[];let line='';
  s.split(' ').forEach(w=>{if((line+' '+w).trim().length>max){out.push(line.trim());line=w;}else line+=' '+w;});
  if(line.trim())out.push(line.trim());return out;
}
function drawCoin(x,y){
  ctx.fillStyle='#b8860b';ctx.fillRect(x-3,y-3,7,7);
  ctx.fillStyle='#ffd23e';ctx.fillRect(x-2,y-2,5,5);
  if((frame>>2)%2){ctx.fillStyle='#fff8dc';ctx.fillRect(x-1,y-2,2,2);}
}
function drawPig(){
  const grow=Math.min(4,Math.floor(coinCount/40));   // cresce a cada 40 moedas
  const pw=12+grow*2;
  const jy=(pigJig>0&&(pigJig%4<2))?-1:1;
  const hx=Math.round(PIGX-pw/2), y=PIGY+jy;
  ctx.fillStyle='#f2a0b5';
  ctx.fillRect(hx,y-6,pw,9);
  ctx.fillRect(hx+1,y-8,pw-2,2);
  ctx.fillStyle='#d97a95';
  ctx.fillRect(hx+1,y-9,3,2);
  ctx.fillRect(PIGX+pw/2,y-5,2,1);ctx.fillRect(PIGX+pw/2+1,y-6,1,2);
  ctx.fillRect(hx+2,y+3,2,2);ctx.fillRect(hx+pw-4,y+3,2,2);
  ctx.fillStyle='#e8b8c8';ctx.fillRect(hx-3,y-3,4,4);
  ctx.fillStyle='#c0557a';ctx.fillRect(hx-2,y-2,1,1);ctx.fillRect(hx-2,y,1,1);
  ctx.fillStyle='#181818';ctx.fillRect(hx+3,y-6,1,2);
  ctx.fillStyle='#8e4a60';ctx.fillRect(PIGX-3,y-8,7,1);
}
function draw(){
  const t=cycleT, dark=darkness(t);
  ctx.fillStyle=skyColor(t);ctx.fillRect(0,0,W,H);
  if(dark>0.15){
    ctx.globalAlpha=(dark-0.15)*2.2;
    STARS.forEach(s=>{ if(((frame>>4)+s.tw)%6!==0){ctx.fillStyle=(s.tw%3)?'#8890b8':'#f4f0dc';ctx.fillRect(s.x,s.y,1,1);} });
    ctx.globalAlpha=Math.min(1,(dark-0.15)*2.5);
    ctx.fillStyle='#f4f0dc';ctx.fillRect(198,32,14,14);ctx.fillRect(196,34,18,10);
    ctx.fillStyle='#d8d4bc';ctx.fillRect(201,35,3,3);ctx.fillRect(207,40,2,2);
    ctx.globalAlpha=1;
  } else {
    const sp=Math.min(1,t*1.45);
    const sx=20+sp*200, sy=110-Math.sin(Math.PI*sp)*78;
    ctx.fillStyle='#ffd23e';ctx.fillRect(sx-7,sy-7,14,14);ctx.fillRect(sx-9,sy-5,18,10);
    ctx.fillStyle='#ffe88a';ctx.fillRect(sx-4,sy-4,8,8);
  }
  ctx.fillStyle='#3a3a4a';
  birds.forEach(b=>{const fl=(frame>>3)%2;ctx.fillRect(b.x,b.y,2,1);ctx.fillRect(b.x+3,b.y+fl,2,1);ctx.fillRect(b.x+2,b.y-1,1,1);});
  clouds.forEach(c=>{
    ctx.fillStyle=dark>0.3?'#3a4368':'#ffffff';
    ctx.fillRect(c.x,c.y+2,c.w,7);ctx.fillRect(c.x+5,c.y,c.w-10,4);
  });
  ctx.fillStyle=dark>0.3?'#22402c':'#4e9a4e';
  ctx.fillRect(0,120,W,20);ctx.fillRect(0,128,W,12);
  ctx.fillRect(30,112,60,10);ctx.fillRect(150,108,80,14);ctx.fillRect(230,116,40,8);
  ctx.fillStyle=dark>0.3?'#2c4a2e':'#6ab04c';ctx.fillRect(0,GY,W,H-GY);
  ctx.fillStyle=dark>0.3?'#253f26':'#5aa044';ctx.fillRect(0,GY,W,3);
  ctx.fillStyle=dark>0.3?'#3f5a30':'#8d6e3f';ctx.fillRect(0,232,W,8);
  ctx.fillStyle=dark>0.3?'#5e1f18':'#c0392b';ctx.fillRect(184,140,64,50);
  ctx.fillStyle=dark>0.3?'#40140f':'#8e2a20';
  ctx.fillRect(180,140,72,6);ctx.fillRect(184,132,64,8);
  ctx.fillRect(204,128,24,6);
  ctx.fillStyle='#f2ead8';ctx.fillRect(202,160,28,30);
  ctx.strokeStyle='#c0392b';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(203,161);ctx.lineTo(229,189);ctx.moveTo(229,161);ctx.lineTo(203,189);ctx.stroke();
  ctx.fillStyle=dark>0.3?'#5a5140':'#e8d8b0';ctx.fillRect(12,120,76,70);
  ctx.fillStyle=dark>0.3?'#4a1f16':'#b04a3a';
  ctx.fillRect(8,120,84,8);ctx.fillRect(6,110,88,10);
  ctx.fillStyle=dark>0.3?'#3f321f':'#7a5230';ctx.fillRect(38,152,22,38);
  ctx.fillStyle='#ffd97a';ctx.fillRect(52,168,3,4);
  const winOn=dark>0.2;
  ctx.fillStyle=winOn?'#ffe9a0':'#3d5a73';ctx.fillRect(20,136,16,14);
  ctx.fillStyle=winOn?'#c8a860':'#2c4256';ctx.fillRect(27,136,2,14);ctx.fillRect(20,142,16,2);
  ctx.fillStyle=winOn?'#ffe9a0':'#3d5a73';ctx.fillRect(64,136,16,14);
  ctx.fillStyle=winOn?'#c8a860':'#2c4256';ctx.fillRect(71,136,2,14);ctx.fillRect(64,142,16,2);
  ctx.fillStyle=dark>0.3?'#5e3a3a':'#9a5a4a';ctx.fillRect(62,92,12,18);
  ctx.fillStyle='#f0f0e0';smoke.forEach(s=>{ctx.globalAlpha=Math.min(0.7,s.life/110+0.2);const r=Math.round(s.r);ctx.fillRect(Math.round(s.x-r),Math.round(s.y-r),r*2,r*2);});
  ctx.globalAlpha=1;
  ctx.fillStyle='#7a4a26';ctx.fillRect(110,150,7,40);
  ctx.fillStyle=dark>0.3?'#1d3d24':'#2e8b4f';
  ctx.fillRect(98,128,32,16);ctx.fillRect(104,116,20,14);ctx.fillRect(110,108,8,8);
  ctx.fillStyle=dark>0.3?'#26492c':'#35a05c';ctx.fillRect(106,124,12,6);
  ctx.fillStyle=dark>0.3?'#6a6250':'#d8c8a8';
  for(let x=8;x<W;x+=16)ctx.fillRect(x,164,5,28);
  ctx.fillRect(0,168,W,4);ctx.fillRect(0,180,W,4);
  FLOWERS.forEach(f=>{
    const sw=Math.sin((frame+f.ph*20)/40)*1;
    ctx.fillStyle=dark>0.3?'#3f6a3f':'#3f8f4f';
    ctx.fillRect(Math.round(f.x+sw*0.4),f.y-5,1,5);
    if(f.bloom){
      if(dark>0.25){ctx.globalAlpha=0.5+Math.sin(frame/10+f.ph)*0.3;ctx.fillStyle=f.c;ctx.fillRect(f.x-3,f.y-8,7,7);ctx.globalAlpha=1;}
      ctx.fillStyle=f.c;ctx.fillRect(f.x-1+sw,f.y-7,3,3);ctx.fillRect(f.x-2+sw,f.y-6,5,1);
      ctx.fillStyle='#fff8dc';ctx.fillRect(f.x+sw,f.y-6,1,1);
    } else {ctx.fillStyle=dark>0.3?'#7a8a6a':'#a8c87a';ctx.fillRect(f.x-1+sw,f.y-6,2,2);}
  });
  const vy=cow.y;
  ctx.fillStyle='#f4f0e8';ctx.fillRect(cow.x,vy-10,24,10);
  ctx.fillRect(cow.x+18,vy-16,8,7);
  ctx.fillStyle='#e8b8c8';ctx.fillRect(cow.x+23,vy-11,4,2);
  ctx.fillStyle='#181818';
  ctx.fillRect(cow.x+3,vy-9,5,4);ctx.fillRect(cow.x+13,vy-6,4,5);ctx.fillRect(cow.x+21,vy-15,3,3);
  ctx.fillRect(cow.x+2,vy,2,3);ctx.fillRect(cow.x+19,vy,2,3);
  const cw=(cow.eat%160<40)?2:0;
  ctx.fillStyle='#f4f0e8';ctx.fillRect(cow.x+17,vy-10+cw,6,4);
  ctx.fillStyle='#8a8a94';const tw=Math.sin(cow.tail/8)*2;
  ctx.fillRect(cow.x-2+tw,vy-10,2,6);
  ctx.fillStyle=dark>0.3?'#4a3a26':'#7a5c38';ctx.fillRect(150,200,96,4);ctx.fillRect(150,216,96,4);ctx.fillRect(144,202,3,30);
  CROPS.forEach(c=>{
    if(!c.show)return;
    if(c.k==='c'){
      ctx.fillStyle='#3f8f4f';ctx.fillRect(c.x-2,c.y-6,1,3);ctx.fillRect(c.x,c.y-7,1,4);ctx.fillRect(c.x+2,c.y-6,1,3);
      ctx.fillStyle='#e8813a';ctx.fillRect(c.x-1,c.y-3,3,3);
    } else if(c.k==='p'){
      ctx.fillStyle=dark>0.3?'#a85a1a':'#e8813a';ctx.fillRect(c.x-4,c.y-6,9,6);ctx.fillRect(c.x-2,c.y-8,5,2);
      ctx.fillStyle='#3f8f4f';ctx.fillRect(c.x-1,c.y-9,2,2);
    } else {
      ctx.fillStyle=dark>0.3?'#a08a40':'#e0c060';
      for(let i=-2;i<=2;i++)ctx.fillRect(c.x+i,c.y-6+((i%2)?1:0),1,6);
      ctx.fillStyle='#f0dc90';ctx.fillRect(c.x-1,c.y-8,1,2);ctx.fillRect(c.x+1,c.y-7,1,2);
    }
  });
  CHICKENS.forEach(c=>{
    const jy=(c.st==='jump')?-5:0;
    const pk=(c.st==='peck'&&frame%20<10)?2:0;
    ctx.fillStyle='#f8f8f0';ctx.fillRect(c.x,c.y-8+jy,7,6);
    ctx.fillRect(c.x+(c.d>0?5:0),c.y-10+jy+pk,4,4);
    ctx.fillStyle='#e23b4e';ctx.fillRect(c.x+(c.d>0?6:1),c.y-12+jy+pk,2,2);
    ctx.fillStyle='#ff9d3e';ctx.fillRect(c.x+(c.d>0?9:0),c.y-8+jy+pk,2,1);
    ctx.fillStyle='#e23b4e';ctx.fillRect(c.x+1,c.y-2+jy,1,2);ctx.fillRect(c.x+4,c.y-2+jy,1,2);
  });
  drawPig();
  drawChar(him,HIM,HIML);
  drawChar(her,HER,HERL);
  if(dark<0.25)butterflies.forEach(b=>{
    const fl=(frame>>2)%2;
    ctx.fillStyle='#e2557f';ctx.fillRect(Math.round(b.x),Math.round(b.y),1,1);
    ctx.fillRect(Math.round(b.x)-1,Math.round(b.y)+(fl?-1:1),1,1);ctx.fillRect(Math.round(b.x)+1,Math.round(b.y)+(fl?-1:1),1,1);
  });
  parts.forEach(p=>{ctx.fillStyle=p.col;ctx.fillRect(Math.round(p.x),Math.round(p.y),2,2);});
  heartFly.forEach(h=>{
    const s=h.life>30?2:1;
    ctx.drawImage(HEART,0,0,8,6,Math.round(h.x-4*s),Math.round(h.y-3*s),8*s,6*s);
  });
  coinsFly.forEach(c=>{
    const x=c.sx+(PIGX-c.sx)*c.t;
    const y=c.sy+(PIGY-8-c.sy)*c.t-Math.sin(Math.PI*c.t)*22;
    drawCoin(Math.round(x),Math.round(y));
  });
  if(dark>0){
    ctx.fillStyle='rgba(10,15,40,'+dark+')';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,233,160,'+(dark*0.5)+')';
    ctx.fillRect(20,136,16,14);ctx.fillRect(64,136,16,14);ctx.fillRect(202,160,28,30);
  }
  fireflies.forEach(f=>{
    const a=0.4+Math.sin(frame/8+f.ph)*0.4;
    ctx.globalAlpha=Math.max(0,a);ctx.fillStyle='#ffe88a';
    ctx.fillRect(Math.round(f.x),Math.round(f.y),2,2);ctx.globalAlpha=1;
  });
  fw.forEach(f=>{if(!f.boom){ctx.fillStyle='#fff';ctx.fillRect(Math.round(f.x),Math.round(f.y),2,4);}});
  drawHUD();
  drawDialog();
  if(finalOn)drawFinal();
  if(state==='title')drawTitle();
}
function drawChar(c,S,SL){
  let img;
  if(c.pose==='sit'){
    img=(c.dir<0)?SL.sit:S.sit;
    ctx.drawImage(img,Math.round(c.x-1),Math.round(c.y-14));
    return;
  }
  if(c.pose==='walk'){
    if(S===HER){ img=((frame>>3)%2)?HERL.idle:HER.idle; } // requebro fofo dela
    else img=[S.wa,S.idle,S.wb,S.idle][(frame>>3)%4];
  }
  else if(c.pose==='hammer'){img=(frame%44<22)?S.h1:S.h2;}
  else img=S.idle;
  if(c.dir<0&&S===HIM){
    img=(c.pose==='hammer')?(frame%44<22?HIML.h1:HIML.h2):(c.pose==='walk'?[HIML.wa,HIML.idle,HIML.wb,HIML.idle][(frame>>3)%4]:HIML.idle);
  }
  const bob=(c.pose==='walk')?((frame>>3)%2):0;
  ctx.drawImage(img,Math.round(c.x-1),Math.round(c.y-bob));
  if(c.pose==='water'&&frame%26<20){
    const rx=c.x-10,ry=c.y+6;
    ctx.fillStyle='#8a9aa8';ctx.fillRect(rx,ry,8,5);ctx.fillRect(rx-3,ry+1,3,2);
    ctx.fillStyle='#6a7a88';ctx.fillRect(rx-3,ry+3,1,2);
  }
}
function drawHUD(){
  ctx.drawImage(HEART,6,6);
  txt('x'+carinho,17,6);
  drawCoin(198,10);
  txt('x'+coinCount,209,6,'#ffd23e');
}
function drawDialog(){
  if(!dlg)return;
  ctx.fillStyle='#fff';ctx.fillRect(8,196,240,38);
  ctx.fillStyle='#101014';ctx.fillRect(10,198,236,34);
  const lines=wrap(dlg.text,28);
  let shown=Math.floor(dlg.chars),li=0;
  for(const ln of lines){
    txt(ln.slice(0,Math.max(0,shown)),16,203+li*11);
    shown-=ln.length+1;li++;
    if(shown<=0)break;
  }
}
function drawFinal(){
  ctx.fillStyle='rgba(8,10,24,0.55)';ctx.fillRect(0,0,W,H);
  const pu=1+Math.sin(frame/12)*0.06;
  txt(FINAL.l1,128,38,'#ffd23e',8,'center');
  wrap(FINAL.l2,26).forEach((ln,i)=>txt(ln,128,56+i*13,'#fff',8,'center'));
  txt('COFRINHO: '+coinCount+' MOEDAS',128,92,'#ffd23e',8,'center');
  txt('CADA UMA É UM DIA AO SEU LADO',128,104,'#9fe0b0',8,'center');
  ctx.save();
  ctx.translate(128,148);ctx.scale(pu,pu);
  txt(FINAL.big,0,-8,'#ff6fa5',16,'center');
  ctx.restore();
  txt(FINAL.l4,128,178,'#ffb3c8',8,'center');
  ctx.drawImage(HEART,0,0,8,6,120,190,16,12);
  if((frame>>4)%2)txt(TOUCH?'TOQUE PARA VIVER OUTRO DIA':'ENTER: VIVER OUTRO DIA',128,224,'#8a94b8',8,'center');
  if(frame%14===0)spawnHeart(30+Math.random()*196,H+10-Math.random()*10);
}
function drawTitle(){
  ctx.fillStyle='rgba(10,14,10,0.6)';ctx.fillRect(0,0,W,H);
  txt('NOSSA',128,50,'#ffd23e',8,'center');
  txt('FAZENDINHA',128,66,'#fff',16,'center');
  txt('26 ANOS DE VOCÊ',128,98,'#9fe0b0',8,'center');
  txt('5 ANOS DE NÓS',128,112,'#ffb3c8',8,'center');
  ctx.drawImage(HEART,0,0,8,6,120,130,16,12);
  if((frame>>4)%2)txt(TOUCH?'TOQUE PARA COMEÇAR':'APERTE ENTER OU TOQUE',128,154,'#fff',8,'center');
}

addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){e.preventDefault();initAudio();
    if(state==='title'){state='life';sfx.pop();}
    else if(finalOn){restart();}
    else if(dlg){if(dlg.chars<dlg.text.length)dlg.chars=dlg.text.length;else dlg=null;}
  }
});

/* ---------------- LOOP + FIT ---------------- */
function loop(){requestAnimationFrame(loop);frame++;update();draw();}
function fit(){
  let s=Math.min((innerWidth-24)/W,(innerHeight-110)/H);
  if(s>=2)s=Math.floor(s);
  s=Math.max(0.55,s);
  cvs.style.width=Math.round(W*s)+'px';
  cvs.style.height=Math.round(H*s)+'px';
}
addEventListener('resize',fit);addEventListener('orientationchange',fit);fit();
let started=false;
function start(){if(started)return;started=true;requestAnimationFrame(loop);}
if(document.fonts&&document.fonts.load){
  Promise.all([document.fonts.load('8px "Press Start 2P"'),document.fonts.load('16px "Press Start 2P"')]).then(start,start);
  setTimeout(start,1500);
}else start();
</script>
